name: Build & Release Android APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write


jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Keystore
        env:
          KEYSTORE_FILE_BASE64: ${{ secrets.KEYSTORE_FILE_BASE64 }}
        run: |
          python3 -c "import os, base64; open('KeyGeo.jks', 'wb').write(base64.b64decode(os.environ['KEYSTORE_FILE_BASE64']))"

      - name: Build with Gradle
        env:
          KEYSTORE_FILE_PATH: "../KeyGeo.jks"
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Verify signing certificate
        run: |
          EXPECTED="1dd1c0ac17d1906d8f77024981bc5cd8192f7641c9b88c9c1c2455ed30b5942b"
          APKSIGNER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -name apksigner 2>/dev/null | sort -V | tail -1)
          echo "apksigner: $APKSIGNER"
          ACTUAL=$("$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk 2>/dev/null \
            | grep "certificate SHA-256 digest" | awk '{print $NF}' | tr 'A-Z' 'a-z')
          echo "Certificado SHA-256 del APK: $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::La firma del APK no coincide con el keystore compartido. La store rechazará la actualización."
            exit 1
          fi
          echo "Firma correcta (mismo keystore compartido que las releases anteriores)."

      - name: Get Version Name
        id: get_version
        run: echo "VERSION_NAME=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Rename APK
        run: mv app/build/outputs/apk/release/app-release-unsigned.apk GeoGas-${{ steps.get_version.outputs.VERSION_NAME }}.apk || mv app/build/outputs/apk/release/app-release.apk GeoGas-${{ steps.get_version.outputs.VERSION_NAME }}.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: GeoGas-${{ steps.get_version.outputs.VERSION_NAME }}.apk
          name: "GeoGas ${{ github.ref_name }}"
          body: |
            ## 🚀 Novedades v1.0.3 — Refactor, microinteracciones y calidad

            - **♻️ Filtros refactorizados**: Patrón Command con deshacer (undo) del último cambio aplicado.
            - **✨ Microinteracciones**: Animación *pop* al marcar favorito y al actualizar el contador de resultados.
            - **📐 Fix de insets (edge-to-edge)**: Headers de paneles y botón de ubicación correctamente posicionados sobre la barra de navegación.
            - **🧹 Calidad de código**: Lint limpio (0 errores / 0 warnings), eliminación de recursos sin usar e icono de launcher optimizado (soporte monochrome).
            - **🔏 Firma verificada**: Release firmada con el keystore compartido (misma identidad que las versiones anteriores).
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
